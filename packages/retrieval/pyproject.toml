[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-research-retrieval"
version = "0.1.0"
description = "Restricted local research retrieval worker derived from AsterCite"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
library = ["pypdf==7.0.1"]
desktop = ["pypdf==7.0.1", "pystray==0.19.5", "pywebview==6.2.1", "pillow==13.0.0"]
memory = ["qdrant-edge-py==0.9.0"]
retrieval = [
    "torch==2.9.1", "transformers==4.57.3", "numpy==2.3.5",
    "faiss-cpu==1.15.1", "rank-bm25==0.2.2",
]
[tool.setuptools.packages.find]
include = ["retriever*"]
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
